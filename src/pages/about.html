<section x-show="section === 'about'" class="page">
  <div class="card about-hero">
    <div class="about-icon-card">
      <svg><use href="#dj-brand"/></svg>
    </div>
    <div class="about-meta">
      <div class="about-title-row">
        <h1>Denpa Jack</h1>
        <span class="tag accent mono">v<span x-text="version || '—'"></span></span>
      </div>
      <div class="row-hint">未来道具14号机：电波劫持者 / 未来ガジェット14号機：電波ジャック</div>
      <div class="row-hint">按住全局热键说话 → ASR → 词典纠错 → LLM 润色 → 自动写入当前光标</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="row-title">应用内更新</div>
        <div class="row-hint" x-text="updateStateText()"></div>
      </div>
      <div class="btns">
        <button class="mini" @click="checkUpdate(false)" :disabled="updateBusy">
          <svg class="ic-xs"><use href="#ic-rerun"/></svg>
          <span x-text="updateBusy ? '检查中…' : '检查更新'"></span>
        </button>
        <button class="mini primary" x-show="updateInfo" @click="installUpdate()" :disabled="updateBusy">下载并安装</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="row-title">启动时自动检查</div>
        <div class="row-hint">仅提示发现新版本，不会自动下载或重启覆盖</div>
      </div>
      <input type="checkbox" class="switch" x-model="cfg.auto_check_update" @change="saveCfg()" />
    </div>
    <div class="row-hint" x-show="updateInfo" x-text="`新版本 ${updateInfo?.version ?? ''} 更新说明：${updateInfo?.notes || '(无)'}`"></div>
  </div>

  <div class="lore-plate">
    <div class="lore-head">
      <span>MIRAI GADGET LAB // NO.14</span>
      <span>MIRAI GAJETTO JŪYON-GŌKI</span>
    </div>
    <p>桥田至开发的未来道具：在 250G 移动硬盘上搭载天线，强制占用同频段电波发送声音与文字。本项目借它指：按下热键，把你说出的话直接送达光标位置。</p>
  </div>
</section>
