      <section x-show="section === 'dict'" class="page">
        <h1>词典</h1>
        <div class="btns" style="margin-bottom: 10px">
          <input class="inp" type="text" placeholder="快速添加词条(回车入库)…" x-model="quickTerm" @keydown.enter="addQuickTerm()" style="flex:1" />
        </div>
        <p class="hint">变体=常见误识别写法; 护栏=出现该词则不纠错; 权重影响热词直传优先级(拼音模糊仅 3 字以上词条)</p>
        <input class="inp" style="margin-top: 10px" placeholder="搜索词条或变体…" x-model="dictSearch" />
        <table class="tbl" x-show="cfg?.dict?.length">
          <thead><tr><th>词条</th><th>变体</th><th>护栏</th><th>权重</th><th></th></tr></thead>
          <tbody>
            <template x-for="e in filteredDict()" :key="e.term">
              <tr>
                <td class="strong" x-text="e.term"></td>
                <td><template x-for="v in e.variants" :key="v"><span class="chip" x-text="v"></span></template>
                    <span class="dim" x-show="!e.variants.length">—</span></td>
                <td class="dim" x-text="e.guard_words.join(', ') || '—'"></td>
                <td x-text="weightStars(e.boost)"></td>
                <td class="btns">
                  <button class="mini" @click="editDict(e)">编辑</button>
                  <button class="mini red" @click="delDict(e)">删除</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="hint" x-show="!cfg?.dict?.length">词典为空 — 添加常用专有名词提升识别率</p>
        <button class="add-btn" @click="newDict()">+ 添加词条</button>

        <!-- 词条编辑 sheet -->
        <template x-if="dictEdit"><div class="overlay" @click.self="dictEdit = null">
          <div class="sheet">
            <h2 x-text="dictIsNew ? '添加词条' : '编辑词条'"></h2>
            <label>词条<input class="inp" x-model="dictEdit.term" placeholder="正确写法, 如: 谢克数学" /></label>
            <label>变体<span class="row-hint">(逗号分隔)</span>
              <input class="inp" x-model="dictEdit.variants" placeholder="些克数学, 歇课数学" /></label>
            <label>护栏词<span class="row-hint">(出现该词则不纠错, 逗号分隔)</span>
              <input class="inp" x-model="dictEdit.guard_words" /></label>
            <label>权重 (热词直传优先级)
              <input class="inp num" type="number" min="0" max="5" x-model.number="dictEdit.boost" /></label>
            <div class="btns end">
              <button class="mini" @click="dictEdit = null">取消</button>
              <button class="mini primary" @click="saveDict()">保存</button>
            </div>
          </div>
        </div></template>
      </section>
