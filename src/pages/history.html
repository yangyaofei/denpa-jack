<section x-show="section === 'history'" class="page page-wide">
  <div class="queue-bar" x-show="queueView.length || recording" x-cloak>
    <template x-for="(s, i) in queueView" :key="i">
      <div class="qb-row" :class="s.state">
        <span class="qb-dot" :class="s.state"></span>
        <span class="qb-t" x-text="(s.source === 'rerun' ? '重转中 · ' : '') + (s.text ? String(s.text).slice(0, 48) : (s.state === 'failed' ? '识别失败（可重试）' : s.state === 'queued' ? '排队等待结算…' : '正在处理…'))"></span>
      </div>
    </template>
    <div class="qb-row recording" x-show="recording">
      <span class="qb-dot recording"></span>
      <span class="qb-t">正在录音试音（16 kHz 单声道）… 点击顶栏「停止」立即结算</span>
    </div>
  </div>

  <div class="split">
    <!-- 左栏：搜索 + 过滤 + 列表 -->
    <div class="pane-left">
      <div class="hist-tools">
        <div class="search-inp-wrap">
          <svg class="ic-sm"><use href="#ic-search"/></svg>
          <input class="inp plain" type="text" placeholder="搜索转写原文或终稿…" x-model="histSearch" />
          <button class="icon-btn" x-show="histSearch" @click="histSearch = ''" title="清除"><svg class="ic-xs"><use href="#ic-close"/></svg></button>
        </div>
        <div class="seg-mini">
          <button :class="histFilter === 'all' ? 'on' : ''" @click="histFilter = 'all'">全部</button>
          <button :class="histFilter === 'llm' ? 'on' : ''" @click="histFilter = 'llm'">润色</button>
          <button :class="histFilter === 'warn' ? 'on' : ''" @click="histFilter = 'warn'">问题</button>
        </div>
      </div>

      <div class="hist-list">
        <template x-for="h in filteredHist()" :key="h.ts">
          <div class="hist-item" :class="{sel: selHist?.ts === h.ts}" @click="selectHist(h)">
            <div class="hi-meta">
              <span class="mono" x-text="h.ts"></span>
              <span x-text="h.engine"></span>
            </div>
            <div class="hi-text" x-text="h.final_text || h.raw || '（空转写）'"></div>
            <div class="hi-tags" x-show="rerunning.has(h.ts) || h.llm_used || h.warning || !(h.delivered||'').includes('paste')">
              <span class="tag info" x-show="rerunning.has(h.ts)">重算中</span>
              <span class="tag indigo" x-show="h.llm_used">LLM 润色</span>
              <span class="tag err" x-show="h.warning" x-text="(h.warning || '').slice(0, 28)"></span>
              <span class="tag" x-show="!(h.delivered||'').includes('paste') && !h.warning" x-text="deliveryLabel(h.delivered)"></span>
            </div>
          </div>
        </template>
        <div class="hist-empty-list" x-show="!filteredHist().length">无匹配记录（按住热键说话即自动收录）</div>
      </div>
    </div>

    <!-- 右栏：详情 / 空态引导 -->
    <div class="pane-right" x-ref="paneRight">
      <template x-if="selHist">
        <div class="detail">
          <div class="detail-head">
            <div class="d-meta">
              <span class="mono" x-text="selHist.ts"></span>
              <span>·</span>
              <span x-text="selHist.engine"></span>
              <span>·</span>
              <span class="tag" :class="(selHist.delivered||'').includes('paste') ? 'green' : ''" x-text="deliveryLabel(selHist.delivered)"></span>
              <span class="tag indigo" x-show="selHist.llm_used">LLM 润色</span>
            </div>
            <div class="btns">
              <button class="mini primary" @click="copyHist(selHist)">
                <svg class="ic-xs"><use :href="copiedKey === ('hist-' + selHist.ts) ? '#ic-check' : '#ic-copy'"/></svg>
                <span x-text="copiedKey === ('hist-' + selHist.ts) ? '已复制' : '复制'"></span>
              </button>
              <button class="mini" :disabled="rerunning.has(selHist.ts)" @click="rerunHist(selHist)">
                <svg class="ic-xs"><use href="#ic-rerun"/></svg>
                <span x-text="rerunning.has(selHist.ts) ? '重算中…' : '重转'"></span>
              </button>
            </div>
          </div>

          <div class="d-card-main">
            <div class="d-label">最终结果</div>
            <div class="d-text strong" x-text="selHist.final_text || selHist.raw || '（无内容）'"></div>
          </div>

          <div class="d-diff-box" x-show="selHist.raw && selHist.raw !== selHist.final_text">
            <div class="d-diff-head">
              <span class="d-label" style="margin:0">原始转写（已由词典 / LLM 修正）</span>
              <button class="link-mini" @click="addTermFromHist(selHist)">把本条加为词条</button>
            </div>
            <div class="d-text dim2" x-text="selHist.raw"></div>
          </div>

          <div class="d-card-sub err-box" x-show="selHist.warning">
            <div class="d-label" style="color:var(--err-text)">处理警告</div>
            <div class="d-text" style="color:var(--err-text)" x-text="selHist.warning"></div>
          </div>

          <div class="d-audio-bar" x-show="selHist.audio_path">
            <div class="d-audio-info">
              <button class="play-circle" @click="playHist(selHist)" title="播放录音">
                <svg class="ic-sm"><use href="#ic-play"/></svg>
              </button>
              <div>
                <div class="row-title">原始录音留存</div>
                <div class="row-hint mono truncate" x-text="selHist.audio_path"></div>
              </div>
            </div>
            <div class="btns">
              <button class="mini" @click="openAudio(selHist)">
                <svg class="ic-xs"><use href="#ic-folder"/></svg>
                <span>在访达中显示</span>
              </button>
              <button class="mini" @click="addTermFromHist(selHist)">加为词条</button>
            </div>
          </div>

          <div class="btns" x-show="!selHist.audio_path">
            <button class="mini" @click="addTermFromHist(selHist)">把本条加为词条</button>
          </div>

          <details class="think" x-show="selHist.llm_thinking">
            <summary>展开 LLM 思考过程</summary>
            <pre class="d-text dim2" x-text="selHist.llm_thinking"></pre>
          </details>
        </div>
      </template>

      <div class="empty-wrap" x-show="!selHist">
        <div class="stat-cards">
          <div class="stat-card">
            <div class="stat-num mono" x-text="histStats().total"></div>
            <div class="stat-label">历史总条数</div>
          </div>
          <div class="stat-card">
            <div class="stat-num mono" x-text="histStats().llmCount"></div>
            <div class="stat-label">LLM 润色</div>
          </div>
          <div class="stat-card">
            <div class="stat-num mono" x-text="histStats().pastedCount"></div>
            <div class="stat-label">直写 / 粘贴</div>
          </div>
        </div>
        <div class="guide-card">
          <div class="guide-row">
            <span class="guide-keys">
              <template x-for="tk in hotkeyTokens()" :key="tk">
                <kbd class="dj-kbd" x-text="tk"></kbd>
              </template>
            </span>
            <span>按住说话，松开自动转写并写入当前光标</span>
          </div>
          <div class="guide-row">
            <span class="guide-keys"><kbd class="dj-kbd">Esc</kbd></span>
            <span>录音期间按下立即丢弃本次音频</span>
          </div>
          <div class="guide-foot">
            <span class="row-hint">想直接测试麦克风与识别链路？</span>
            <button class="mini primary" @click="toggleRecording()" x-text="recording ? '停止试音' : '立即试音'"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
