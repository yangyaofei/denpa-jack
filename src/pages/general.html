      <section x-show="section === 'general'" class="page">
        <h1>通用</h1>
        <div class="card" x-show="perms.length">
          <div class="row">
            <div>
              <div class="row-title">权限</div>
              <div class="row-hint">两项都必须有；缺任一项都会影响使用（启动时自动检查，授权后无需重启）</div>
            </div>
            <button class="mini" @click="checkPerms()">重新检测</button>
          </div>
          <template x-for="p in perms" :key="p.key">
            <div>
              <div class="perm-row">
                <span class="perm-dot" :class="p.granted ? 'ok' : 'bad'"></span>
                <span class="perm-name" x-text="p.label"></span>
                <span class="perm-state" :class="p.granted ? '' : 'bad'" x-text="permStatusText(p)"></span>
                <span class="perm-actions">
                  <button class="mini" x-show="!p.granted && p.key === 'microphone' && p.status === 'not_determined'"
                          @click="requestMic()">请求授权</button>
                  <button class="mini" x-show="!p.granted" @click="openPermSettings(p)">打开系统设置</button>
                </span>
              </div>
              <div class="row-hint perm-impact" x-show="!p.granted" x-text="`${p.purpose} —— ${p.impact}`"></div>
            </div>
          </template>
        </div>
        <div class="card">
          <div class="row">
            <div>
              <div class="row-title" x-text="`按住 ${hotkeyLabel()} 说话`"></div>
              <div class="row-hint">全局快捷键: 按住录音, 松开转写并粘贴</div>
            </div>
            <button class="rec-btn" @click="toggleRec()" x-text="recording ? '■ 停止' : '试音'"></button>
          </div>
        </div>
        <div class="card">
          <div class="row">
            <div>
              <div class="row-title">触发模式</div>
              <div class="row-hint" x-text="cfg?.activation === 'toggle' ? '短按一下开始录音, 再短按一下结束并转写' : '按住说话, 松开结束转写(默认)'"></div>
            </div>
            <select class="picker" :value="cfg?.activation || 'hold'" @change="setActivation($event)">
              <option value="hold">按住说话</option>
              <option value="toggle">短按切换</option>
            </select>
          </div>
        </div>
        <div class="card">
          <div class="row-title" style="padding:0 2px">录音快捷键(以下全部生效)</div>
            <div class="row-hint" style="padding:0 2px 6px">按住任一组合即录音; 点 + 录制新组合(按键后松开即添加, Esc 取消); 点 × 删除</div>
            <div class="hk-list">
              <template x-for="(h, idx) in hkList()" :key="h">
                <div class="hk-item">
                  <span class="hk-name" x-text="describeCombo(h)"></span>
                  <button class="hk-del" @click="removeHotkey(h)">×</button>
                </div>
              </template>
            </div>
            <button class="hk-add" @click="startHotkeyRecord()" x-show="!hkCapturing">+ 录制新组合</button>
            <div class="hk-capture" x-show="hkCapturing">
              <div class="hk-live" x-text="hkFinal ? ('录到: ' + describeCombo(hkFinal)) : (hkCurrent ? ('当前: ' + describeCombo(hkCurrent)) : '按下组合键, 全部松开后确认(Esc 取消)…')"></div>
              <template x-if="hkFinal">
                <div class="btns end">
                  <button class="mini" @click="cancelHotkey()">取消</button>
                  <button class="mini primary" @click="confirmHotkey()">添加</button>
                </div>
              </template>
            </div>
            <div class="row-hint" style="padding:6px 2px 0">快捷添加常用 Fn 组合(也可直接录制):</div>
            <div style="display:flex; gap:6px; margin-top:4px">
              <button class="mini" @click="addFnPreset('fn')">+ fn</button>
              <button class="mini" @click="addFnPreset('fn+ctrl')">+ fn+ctrl</button>
              <button class="mini" @click="addFnPreset('fn+cmd')">+ fn+cmd</button>
              <button class="mini" @click="addFnPreset('fn+space')">+ fn+space</button>
            </div>
          </div>
        <button class="add-btn" @click="newAsr()">+ 添加引擎档案</button>
        <div class="card">
          <div class="row-title">热词直传预览</div>
          <div class="row-hint">来自词典(按权重前 100 token 预算), 改词典即时生效</div>
          <div style="margin-top: 6px">
            <template x-for="w in hotwordsPreview" :key="w"><span class="chip accent" x-text="w"></span></template>
            <span class="dim" x-show="!hotwordsPreview.length">无热词(词典为空或权重为 0)</span>
          </div>
        </div>
        <div class="card">
          <div class="row-title">当前输入设备(实际使用)</div>
          <div class="row-hint" x-text="activeMic ? activeMic[1] : '开始一次录音后显示'"></div>
        </div>
        <div class="card">
          <div class="row-title">麦克风优先级(按序取第一个在线的设备)</div>
          <div class="mini-table">
            <template x-for="(u, i) in cfg?.mic_priority ?? []" :key="u">
              <div class="mini-row" :class="{sel: prioSel === i}" @click="prioSel = i"
                   x-text="`${i + 1}. ${micName(u)}${mics.some(m => m.uid === u) ? '' : ' (已断开)'}`"></div>
            </template>
            <div class="row-hint" x-show="!cfg?.mic_priority?.length">空 — 把指定设备加入优先级</div>
          </div>
          <div class="btns" style="margin-top: 8px">
            <select class="inp" x-model="micToAdd">
              <option value="">选择设备…</option>
              <template x-for="m in mics" :key="m.uid"><option :value="m.uid" x-text="m.name"></option></template>
            </select>
            <button class="mini" @click="addToPriority()" :disabled="!micToAdd">加入</button>
            <button class="mini" @click="movePriority(prioSel, -1)">上移</button>
            <button class="mini" @click="movePriority(prioSel, 1)">下移</button>
            <button class="mini" @click="removePriority(prioSel)">移除</button>
          </div>
        </div>

        <!-- ASR 编辑 sheet -->
        <template x-if="asrEdit"><div class="overlay" @click.self="asrEdit = null">
          <div class="sheet">
            <h2 x-text="asrIsNew ? '添加引擎' : '编辑引擎'"></h2>
            <label>名称<input class="inp" x-model="asrEdit.name" /></label>
            <label>引擎
              <select class="inp" x-model="asrEdit.provider">
                <option value="volcengine">火山引擎 (豆包流式)</option>
              </select>
            </label>
            <label>API Key<span class="row-hint">(留空用 Key 池)</span>
              <input class="inp" type="password" x-model="asrEdit.api_key" />
            </label>
            <div class="row">
              <span>词典热词直传</span>
              <input type="checkbox" class="switch" x-model="asrEdit.hotwords_enabled" />
            </div>
            <div class="btns end">
              <button class="mini" @click="asrEdit = null">取消</button>
              <button class="mini primary" @click="saveAsr()">保存</button>
            </div>
          </div>
        </div></template>
      </section>
