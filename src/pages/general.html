      <section x-show="section === 'general'" class="page">
        <h1>通用</h1>
        <div class="card">
          <div class="row">
            <div>
              <div class="row-title" x-text="`按住 ${hotkeyLabel()} 说话`"></div>
              <div class="row-hint">全局快捷键: 按住录音, 松开转写并粘贴</div>
            </div>
            <button class="rec-btn" @click="toggleRec()" x-text="recording ? '■ 停止' : '试音'"></button>
          </div>
        </div>
        <div class="card">
            <div class="row-title" style="padding:0 2px">录音快捷键</div>
            <div class="row-hint" style="padding:0 2px 6px">按住任一组合即录音; 点击 + 录制新组合, 点击 × 删除; 任意组合(含 Fn)均可录制</div>
            <div class="hk-list">
              <template x-for="(h, idx) in hkList()" :key="idx + h.key">
                <div class="hk-item">
                  <span class="hk-name" x-text="describeHotkey(h)"></span>
                  <button class="hk-del" @click="removeHotkey(idx)">×</button>
                </div>
              </template>
            </div>
            <button class="hk-add" @click="startHotkeyRecord()" x-show="!hkCapturing">+ 录制新组合</button>
            <div class="hk-capture" x-show="hkCapturing">
              <div class="hk-live" x-text="hkFinal ? ('结果: ' + hkFinal) : (hkCurrent ? ('当前: ' + hkCurrent) : '按下组合键…')"></div>
              <template x-if="hkFinal">
                <div class="btns end">
                  <button class="mini" @click="cancelHotkey()">取消</button>
                  <button class="mini primary" @click="confirmHotkey()">确认添加</button>
                </div>
              </template>
            </div>
          </div>
        <button class="add-btn" @click="newAsr()">+ 添加引擎档案</button>
        <div class="card">
          <div class="row-title">热词直传预览</div>
          <div class="row-hint">来自词典(按权重前 100 token 预算), 改词典即时生效</div>
          <div style="margin-top: 6px">
            <template x-for="w in hotwordsPreview" :key="w"><span class="chip accent" x-text="w"></span></template>
            <span class="dim" x-show="!hotwordsPreview.length">无热词(词典为空或权重为 0)</span>
          </div>
        </div>
        <div class="card">
          <div class="row-title">当前输入设备(实际使用)</div>
          <div class="row-hint" x-text="activeMic ? activeMic[1] : '开始一次录音后显示'"></div>
        </div>
        <div class="card">
          <div class="row-title">麦克风优先级(按序取第一个在线的设备)</div>
          <div class="mini-table">
            <template x-for="(u, i) in cfg?.mic_priority ?? []" :key="u">
              <div class="mini-row" :class="{sel: prioSel === i}" @click="prioSel = i"
                   x-text="`${i + 1}. ${micName(u)}${mics.some(m => m.uid === u) ? '' : ' (已断开)'}`"></div>
            </template>
            <div class="row-hint" x-show="!cfg?.mic_priority?.length">空 — 把指定设备加入优先级</div>
          </div>
          <div class="btns" style="margin-top: 8px">
            <select class="inp" x-model="micToAdd">
              <option value="">选择设备…</option>
              <template x-for="m in mics" :key="m.uid"><option :value="m.uid" x-text="m.name"></option></template>
            </select>
            <button class="mini" @click="addToPriority()" :disabled="!micToAdd">加入</button>
            <button class="mini" @click="movePriority(prioSel, -1)">上移</button>
            <button class="mini" @click="movePriority(prioSel, 1)">下移</button>
            <button class="mini" @click="removePriority(prioSel)">移除</button>
          </div>
        </div>

        <!-- ASR 编辑 sheet -->
        <template x-if="asrEdit"><div class="overlay" @click.self="asrEdit = null">
          <div class="sheet">
            <h2 x-text="asrIsNew ? '添加引擎' : '编辑引擎'"></h2>
            <label>名称<input class="inp" x-model="asrEdit.name" /></label>
            <label>引擎
              <select class="inp" x-model="asrEdit.provider">
                <option value="volcengine">火山引擎 (豆包流式)</option>
              </select>
            </label>
            <label>API Key<span class="row-hint">(留空用 Key 池)</span>
              <input class="inp" type="password" x-model="asrEdit.api_key" />
            </label>
            <div class="row">
              <span>词典热词直传</span>
              <input type="checkbox" class="switch" x-model="asrEdit.hotwords_enabled" />
            </div>
            <div class="btns end">
              <button class="mini" @click="asrEdit = null">取消</button>
              <button class="mini primary" @click="saveAsr()">保存</button>
            </div>
          </div>
        </div></template>
      </section>
