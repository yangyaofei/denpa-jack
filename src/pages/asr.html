      <section x-show="section === 'asr'" class="page">
        <h1>语音识别</h1>
        <div class="card" :class="{active: cfg?.active_asr_id === 'builtin'}" style="margin-bottom: 8px">
          <div class="row">
            <div>
              <div class="row-title">
                <span>内置本地引擎</span>
                <span class="tag">内置</span>
                <span class="tag" x-show="cfg?.active_asr_id === 'builtin'">使用中</span>
              </div>
              <div class="row-hint">Denpa ASR · 随机端口联动，零配置；生命周期随 APP（下方网关卡可控）</div>
            </div>
            <div style="display: flex; gap: 6px">
              <button class="mini" @click="useAsr({id: 'builtin'})" x-show="cfg?.active_asr_id !== 'builtin'">使用</button>
            </div>
          </div>
        </div>
        <template x-for="p in cfg?.asr_profiles ?? []" :key="p.id">
          <div class="card" :class="{active: cfg?.active_asr_id === p.id}" style="margin-bottom: 8px">
            <div class="row">
              <div>
                <div class="row-title">
                  <span x-text="p.name"></span>
                  <span class="tag" x-text="p.provider"></span>
                  <span class="tag" x-show="cfg?.active_asr_id === p.id">使用中</span>
                </div>
                <div class="row-hint" x-text="'Key: ' + (p.api_key ? p.api_key.slice(0, 8) + '…' : '未设置') + (p.hotwords_enabled ? ' · 热词开' : '')"></div>
              </div>
              <div style="display: flex; gap: 6px">
                <button class="mini" @click="useAsr(p)" x-show="cfg?.active_asr_id !== p.id">使用</button>
                <button class="mini" @click="editAsr(p)">编辑</button>
                <button class="mini danger" @click="delAsr(p)">删除</button>
              </div>
            </div>
          </div>
        </template>
        <button class="add-btn" @click="newAsr()">+ 添加引擎档案</button>
        <div class="card">
          <div class="row-title">
            热词直传预览
            <span class="tag" x-text="(hotwordsPreview?.length ?? 0) + ' 个'"></span>
          </div>
          <div class="row-hint">来自词典(按权重排序取前 100 token), 改词典即时生效; 该列表实时直传给引擎</div>
          <div class="chips-box" style="margin-top: 8px">
            <template x-for="w in hotwordsPreview" :key="w"><span class="chip accent" x-text="w"></span></template>
            <span class="dim" x-show="!hotwordsPreview.length">无热词(词典为空或权重为 0)</span>
          </div>
        </div>
        <div class="card">
          <div class="row-title">当前输入设备(实际使用)</div>
          <div class="row-hint" x-text="activeMic ? activeMic[1] : '开始一次录音后显示'"></div>
        </div>
        <div class="card">
          <div class="row-title">麦克风优先级(按序取第一个在线的设备)</div>
          <div class="mini-table">
            <template x-for="(u, i) in cfg?.mic_priority ?? []" :key="u">
              <div class="mini-row" :class="{sel: prioSel === i}" @click="prioSel = i"
                   x-text="`${i + 1}. ${micName(u)}${mics.some(m => m.uid === u) ? '' : ' (已断开)'}`"></div>
            </template>
            <div class="row-hint" x-show="!cfg?.mic_priority?.length">空 — 把指定设备加入优先级</div>
          </div>
          <div class="btns" style="margin-top: 8px">
            <select class="inp" x-model="micToAdd">
              <option value="">选择设备…</option>
              <template x-for="m in mics" :key="m.uid"><option :value="m.uid" x-text="m.name"></option></template>
            </select>
            <button class="mini" @click="addToPriority()" :disabled="!micToAdd">加入</button>
            <button class="mini" @click="movePriority(prioSel, -1)">上移</button>
            <button class="mini" @click="movePriority(prioSel, 1)">下移</button>
            <button class="mini" @click="removePriority(prioSel)">移除</button>
          </div>
        </div>

        <div class="card">
          <h2>内置网关</h2>
          <div class="row">
            <span>状态<span class="row-hint" x-show="localSvc.port" x-text="'127.0.0.1:' + localSvc.port"></span></span>
            <span class="tag"
                  :class="localSvc.state === 'running' ? 'green' : (localSvc.state === 'starting' ? 'warn' : ((localSvc.state === 'failed' || localSvc.state === 'crashed') ? 'err' : ''))"
                  x-text="localSvcText"></span>
          </div>
          <div class="row">
            <span>APP 启动时自动拉起</span>
            <input type="checkbox" class="switch" x-model="cfg.local_autostart" @change="saveCfg()" />
          </div>
          <label>项目目录<span class="row-hint">(denpa-asr 仓库位置)</span>
            <input class="inp" x-model="cfg.local_service_dir" @change="saveCfg()" />
          </label>
          <div class="btns end">
            <button class="mini" @click="localSvcAction('start')"
                    :disabled="localSvc.busy || localSvc.state === 'starting' || localSvc.state === 'running'"
                    x-text="localSvc.state === 'starting' ? '启动中…' : '启动'"></button>
            <button class="mini" @click="localSvcAction('stop')"
                    :disabled="localSvc.busy || (localSvc.state !== 'running' && localSvc.state !== 'starting')">停止</button>
          </div>
          <pre id="local-svc-log" class="log-box"><template x-for="(l, i) in localSvc.tail" :key="i"><span x-text="l"></span>
</template><span class="dim" x-show="!localSvc.tail.length">（暂无日志——启动后网关的输出会显示在这里，等效终端）</span></pre>
          <p class="hint">内置实例随 APP 退出而优雅停止；手动 <code>denpa-asr serve</code> 的外部实例不受 APP 管理（用「外部网关」档案接它）。</p>
        </div>

        <!-- ASR 编辑 sheet -->
        <template x-if="asrEdit"><div class="overlay" @click.self="asrEdit = null">
          <div class="sheet">
            <h2 x-text="asrIsNew ? '添加引擎' : '编辑引擎'"></h2>
            <label>名称<input class="inp" x-model="asrEdit.name" /></label>
            <label>引擎
              <select class="inp" x-model="asrEdit.provider">
                <option value="volcengine">火山引擎 (豆包流式)</option>
                <option value="local">外部网关 (自建 denpa-asr)</option>
              </select>
            </label>
            <label x-show="asrEdit.provider === 'local'" x-cloak>服务地址<span class="row-hint">(外部网关必填，如手动 serve 或远程机器)</span>
              <input class="inp" placeholder="127.0.0.1:8300 或 ws://192.168.1.5:8300" x-model="asrEdit.base_url" />
            </label>
            <label x-show="asrEdit.provider !== 'local'" x-cloak>API Key<span class="row-hint">(该引擎档案的密钥)</span>
              <input class="inp" type="password" x-model="asrEdit.api_key" />
            </label>
            <div class="row">
              <span>词典热词直传</span>
              <input type="checkbox" class="switch" x-model="asrEdit.hotwords_enabled" />
            </div>
            <div class="btns end">
              <button class="mini" @click="asrEdit = null">取消</button>
              <button class="mini primary" @click="saveAsr()">保存</button>
            </div>
          </div>
        </div></template>
      </section>
