<section x-show="section === 'asr'" class="page">
  <div class="page-head">
    <div>
      <h1>语音识别</h1>
      <p class="hint">支持豆包流式、智谱与本机独立网关（denpa-asr）；底部管理热词预算与麦克风优先级</p>
    </div>
    <button class="mini primary" @click="newAsr()">
      <svg class="ic-xs"><use href="#ic-plus"/></svg>
      <span>添加引擎档案</span>
    </button>
  </div>

  <!-- 内置本地网关卡片 -->
  <div class="card profile" :class="{active: cfg?.active_asr_id === 'builtin', dirty: builtinDirty}">
    <div class="row">
      <div>
        <div class="row-title">
          <span>内置本地引擎</span>
          <span class="tag">denpa-asr</span>
          <span class="tag accent" x-show="cfg?.active_asr_id === 'builtin'">使用中</span>
          <span class="tag"
                :class="localSvc.state === 'running' ? 'green' : (localSvc.state === 'starting' ? 'warn' : ((localSvc.state === 'failed' || localSvc.state === 'crashed') ? 'err' : ''))"
                x-text="localSvcText"></span>
          <span class="row-hint mono" x-show="localSvc.port" x-text="'127.0.0.1:' + localSvc.port"></span>
        </div>
        <div class="row-hint">随机空闲端口联动，随主应用优雅停止</div>
      </div>
      <div class="btns">
        <button class="mini" @click="useAsr({id: 'builtin'})" x-show="cfg?.active_asr_id !== 'builtin'">使用</button>
        <button class="mini" @click="localSvcAction('start')"
                :disabled="localSvc.busy || localSvc.state === 'starting' || localSvc.state === 'running'"
                x-text="localSvc.state === 'starting' ? '启动中…' : '启动'"></button>
        <button class="mini" @click="localSvcAction('stop')"
                :disabled="localSvc.busy || (localSvc.state !== 'running' && localSvc.state !== 'starting')">停止</button>
        <button class="mini warn-btn" x-show="builtinDirty && localSvc.state === 'running'" @click="restartBuiltin()">重启生效</button>
      </div>
    </div>

    <div class="dirty-strip" x-show="builtinDirty">
      <span class="dirty-dot"></span>
      <span>解码参数已改动，重启网关（或下次启动）后生效</span>
    </div>

    <!-- 紧凑摘要胶囊条（低频工程参数默认折叠，点击展开） -->
    <div class="summary-bar">
      <div class="summary-pills">
        <template x-for="(part, idx) in builtinSummary()" :key="idx">
          <span class="sum-pill mono" :class="idx === 0 ? 'strong' : ''" x-text="part"></span>
        </template>
      </div>
      <button class="link-mini chev-btn" @click="asrTuningOpen = !asrTuningOpen">
        <span x-text="asrTuningOpen ? '收起调优' : '展开调优'"></span>
        <svg class="ic-xs" :class="asrTuningOpen ? 'rot-180' : ''"><use href="#ic-chev-down"/></svg>
      </button>
    </div>

    <div class="tuning-panel" x-show="asrTuningOpen" x-cloak>
      <label>模型<span class="row-hint">(Repo ID 自动下载到项目 models/，或本地路径)</span>
        <input class="inp mono" x-model="cfg.builtin_engine.model" @change="markBuiltinDirty(); saveCfg()" />
      </label>
      <div class="grid-2">
        <label>VAD 静音门控<span class="row-hint">(ten 会吃气声首尾帧)</span>
          <select class="inp" x-model="cfg.builtin_engine.vad" @change="markBuiltinDirty(); saveCfg()">
            <option value="">关（默认）</option>
            <option value="ten">ten</option>
            <option value="silero">silero</option>
          </select>
        </label>
        <label>端点检测
          <select class="inp" x-model="cfg.builtin_engine.endpointing" @change="markBuiltinDirty(); saveCfg()">
            <option value="energy">energy（默认）</option>
            <option value="fixed">fixed</option>
          </select>
        </label>
        <label>二遍全句重解<span class="row-hint">(松手后完整重解)</span>
          <select class="inp" :value="cfg.builtin_engine.twopass ? '1' : '0'" @change="cfg.builtin_engine.twopass = $event.target.value === '1'; markBuiltinDirty(); saveCfg()">
            <option value="1">开（默认）</option>
            <option value="0">关</option>
          </select>
        </label>
        <label>并发会话上限
          <div class="unit-input">
            <input class="inp" type="number" min="1" max="8" x-model.number="cfg.builtin_engine.max_sessions" @change="markBuiltinDirty(); saveCfg()" />
            <span class="unit-tag">路</span>
          </div>
        </label>
        <label>流式分块间隔
          <div class="unit-input">
            <input class="inp" type="number" min="0.3" max="2" step="0.1" x-model.number="cfg.builtin_engine.chunk_size_sec" @change="markBuiltinDirty(); saveCfg()" />
            <span class="unit-tag">秒</span>
          </div>
        </label>
        <label>解码窗上限
          <div class="unit-input">
            <input class="inp" type="number" min="30" max="300" step="10" x-model.number="cfg.builtin_engine.max_context_sec" @change="markBuiltinDirty(); saveCfg()" />
            <span class="unit-tag">秒</span>
          </div>
        </label>
      </div>
      <label>项目目录<span class="row-hint">(denpa-asr 仓库位置)</span>
        <input class="inp mono" x-model="cfg.local_service_dir" @change="markBuiltinDirty(); saveCfg()" />
      </label>
    </div>

    <div class="row sub-foot">
      <label class="inline-switch">
        <input type="checkbox" class="switch" x-model="cfg.local_autostart" @change="markBuiltinDirty(); saveCfg()" />
        <span>APP 启动时自动拉起内置网关</span>
      </label>
      <button class="link-mini chev-btn" @click="asrLogOpen = !asrLogOpen"
              x-show="localSvc.state !== 'starting' && localSvc.state !== 'failed' && localSvc.state !== 'crashed'">
        <span x-text="asrLogOpen ? '收起网关日志' : '查看网关输出'"></span>
        <svg class="ic-xs" :class="asrLogOpen ? 'rot-180' : ''"><use href="#ic-chev-down"/></svg>
      </button>
    </div>

    <div x-show="asrLogOpen || localSvc.state === 'starting' || localSvc.state === 'failed' || localSvc.state === 'crashed'">
      <pre id="local-svc-log" class="log-box"><template x-for="(l, i) in localSvc.tail" :key="i"><span x-text="l"></span>
</template><span class="dim" x-show="!localSvc.tail.length">（暂无日志——启动后网关的输出会显示在这里）</span></pre>
      <p class="hint" style="margin-top:6px">内置实例随 APP 退出优雅停止；手动 <code>denpa-asr serve</code> 的外部实例不受 APP 管理。</p>
    </div>
  </div>

  <!-- 云端 / 外部引擎档案列表 -->
  <template x-for="p in cfg?.asr_profiles ?? []" :key="p.id">
    <div class="card profile" :class="{active: cfg?.active_asr_id === p.id}">
      <div class="row">
        <div>
          <div class="row-title">
            <span x-text="p.name"></span>
            <span class="tag mono" x-text="p.provider"></span>
            <span class="tag accent" x-show="cfg?.active_asr_id === p.id">使用中</span>
          </div>
          <div class="row-hint mono" x-text="p.provider === 'local' ? (p.base_url || '未填网关地址') : ('Key: ' + (p.api_key ? p.api_key.slice(0, 8) + '…' : '未设置'))"></div>
        </div>
        <div class="btns">
          <button class="mini" @click="useAsr(p)" x-show="cfg?.active_asr_id !== p.id">使用</button>
          <button class="mini" @click="editAsr(p)">编辑</button>
          <button class="mini red" @click="delAsr(p)">删除</button>
        </div>
      </div>
    </div>
  </template>

  <!-- 热词直传预览 -->
  <div class="card">
    <div class="row">
      <div class="row-title">
        热词直传预览
        <span class="tag mono" x-text="(hotwordsPreview?.length ?? 0) + ' 个'"></span>
      </div>
      <span class="row-hint">按词典权重取前 100 token，修改词典即时生效</span>
    </div>
    <div class="chips-box">
      <template x-for="w in hotwordsPreview" :key="w"><span class="chip accent" x-text="w"></span></template>
      <span class="dim" x-show="!hotwordsPreview.length">无热词（词典为空或权重为 0）</span>
    </div>
  </div>

  <!-- 麦克风与设备优先级 -->
  <div class="card">
    <div class="row">
      <div>
        <div class="row-title">麦克风优先级</div>
        <div class="row-hint">按顺序自动选用第一个在线的设备</div>
      </div>
      <span class="tag green" x-text="'当前：' + (activeMic ? activeMic[1] : '默认设备')"></span>
    </div>
    <div class="mini-table">
      <template x-for="(u, i) in cfg?.mic_priority ?? []" :key="u">
        <div class="mini-row" :class="{sel: prioSel === i}" @click="prioSel = i">
          <span class="mono" x-text="(i + 1) + '.'"></span>
          <span style="flex:1" x-text="micName(u)"></span>
          <span class="tag" :class="mics.some(m => m.uid === u) ? 'green' : 'err'" x-text="mics.some(m => m.uid === u) ? '在线' : '已断开'"></span>
        </div>
      </template>
      <div class="row-hint" x-show="!cfg?.mic_priority?.length" style="padding:4px 2px">空 — 从下方选择设备加入优先级</div>
    </div>
    <div class="btns" style="margin-top:4px">
      <select class="inp" x-model="micToAdd" style="flex:1">
        <option value="">选择设备…</option>
        <template x-for="m in mics" :key="m.uid"><option :value="m.uid" x-text="m.name"></option></template>
      </select>
      <button class="mini" @click="addToPriority()" :disabled="!micToAdd">加入</button>
      <button class="mini icon-only" @click="movePriority(prioSel, -1)" title="上移"><svg class="ic-xs"><use href="#ic-up"/></svg></button>
      <button class="mini icon-only" @click="movePriority(prioSel, 1)" title="下移"><svg class="ic-xs"><use href="#ic-down"/></svg></button>
      <button class="mini" @click="removePriority(prioSel)">移除</button>
    </div>
  </div>

  <!-- ASR 编辑 sheet -->
  <template x-if="asrEdit"><div class="overlay" @click.self="asrEdit = null">
    <div class="sheet">
      <h2 x-text="asrIsNew ? '添加引擎' : '编辑引擎'"></h2>
      <label>名称<input class="inp" x-model="asrEdit.name" /></label>
      <label>引擎
        <select class="inp" x-model="asrEdit.provider">
          <option value="volcengine">火山引擎（豆包流式）</option>
          <option value="zhipu">智谱（GLM-ASR 文件式）</option>
          <option value="local">外部网关（自建 denpa-asr）</option>
        </select>
      </label>
      <label x-show="asrEdit.provider === 'local'" x-cloak>服务地址<span class="row-hint">(如 127.0.0.1:8300 或 ws://...)</span>
        <input class="inp mono" placeholder="127.0.0.1:8300" x-model="asrEdit.base_url" />
      </label>
      <label x-show="asrEdit.provider !== 'local'" x-cloak>API Key<span class="row-hint">(该引擎档案的密钥)</span>
        <input class="inp mono" type="password" x-model="asrEdit.api_key" />
      </label>
      <div class="btns end">
        <button class="mini" @click="asrEdit = null">取消</button>
        <button class="mini primary" @click="saveAsr()">保存</button>
      </div>
    </div>
  </div></template>
</section>
