[package]
name = "denpa-jack"
version = "0.3.5"
description = "Denpa Jack — 未来道具14号机：电波劫持者 (Mirai Gajetto Jūyon-gōki: Denpa Jakku). Push-to-talk dictation for macOS: audio → ASR → dictionary/LLM polish → clipboard."
authors = ["yangyaofei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
default-run = "denpa-jack"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "denpa_jack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
cpal = "0.18.2"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
flate2 = "1.1.10"
uuid = { version = "1.26.0", features = ["v4"] }
http = "1.5.0"
base64 = "0.23.1"
sha2 = "0.10.9"
pinyin = "0.11.0"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
enigo = "0.6.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
regex = "1.13.1"
tauri-plugin-single-instance = "2.4.4"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = ["NSStatusBar", "NSStatusItem", "NSButton", "NSMenu", "NSMenuItem", "NSImage", "NSResponder", "NSApplication", "NSControl", "NSColor", "NSPasteboard", "NSSound"] }
tauri-plugin-autostart = "2.5.1"
core-graphics = "0.25.0"
handy-keys = "0.3.4"
objc2-av-foundation = { version = "0.3.2", features = ["AVMediaFormat", "block2"] }
block2 = "0.6"
libc = "0.2.189"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"


[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# handy-keys 0.3.4 打了两个 macOS 键盘状态修复，以 fork 的固定 commit 引入（见 docs/DEPENDENCIES.md）。
# 用 rev 而非 branch：Cargo.lock 也钉死该版本，分支后续变动不会影响构建。
# 上游合并发布新版本后：删除本段，改回 crates.io 的修复版。
handy-keys = { git = "https://github.com/yangyaofei/handy-keys", rev = "27edee4e7af2689630f5450887197a8dce7a0a1d" }
