name: Release

# 触发：推 v* tag，或在 Actions 页面手动指定 tag
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例如 v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    runs-on: macos-14
    env:
      # 版本号：tag 触发用 ref 名；手动触发用输入
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Inject version from tag
        run: |
          V="${RELEASE_TAG#v}"
          echo "building version $V"
          node -e "const fs=require('fs');const f='package.json';const j=JSON.parse(fs.readFileSync(f));j.version='$V';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$V';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$V\"/" src-tauri/Cargo.toml
          grep -n "^version" src-tauri/Cargo.toml

      - name: Build app bundle
        env:
          # 更新包的 minisign 签名（tauri-plugin-updater 强制要求，无法关闭）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY；应用内更新需要对更新包签名（本机密钥见 certs/denpa-jack-updater.key）"
            exit 1
          fi
          npm run tauri build -- --bundles app
          ls -l "src-tauri/target/release/bundle/macos/"

      - name: Prepare signing material (from repository secrets)
        env:
          P12_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$P12_PW" ]; then
            echo "::error::缺少 APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD；请在仓库 Settings → Secrets and variables → Actions 配置（密码放 Secrets，不要放 Variables）"
            exit 1
          fi
          mkdir -p certs
          printf '%s' "$P12_B64" | python3 -c "import base64,sys;open('certs/ci.p12','wb').write(base64.b64decode(sys.stdin.read()))"
          printf '%s' "$P12_PW" > certs/ci.pw
          chmod 600 certs/ci.p12 certs/ci.pw
          ls -l certs

      - name: Install rcodesign
        run: |
          curl -sSfL -o /tmp/rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-aarch64-apple-darwin.tar.gz"
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          sudo mv /tmp/apple-codesign-0.29.0-aarch64-apple-darwin/rcodesign /usr/local/bin/rcodesign
          rcodesign --version

      - name: Sign and verify the app
        run: |
          APP="src-tauri/target/release/bundle/macos/Denpa Jack.app"
          rcodesign sign --p12-file certs/ci.p12 --p12-password-file certs/ci.pw "$APP"
          # rcodesign verify 只认 Mach-O 单文件；校验整个 .app 包用 codesign --verify --deep
          rcodesign verify "$APP/Contents/MacOS/denpa-jack"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # 断言签名身份：不是本项目证书就等于更新后会丢权限（实测踩过：updater 包早于签名生成）
          # 不用 `codesign … | grep -q …`：grep -q 命中即退出会给 codesign 发 SIGPIPE，
          # 在 set -e 的默认 shell 语义下容易误判，这里先取输出再匹配。
          DV="$(codesign -dvv "$APP" 2>&1 || true)"
          case "$DV" in
            *"Authority=Denpa Jack Dev"*) echo "签名身份 ✓ Denpa Jack Dev" ;;
            *) echo "::error::签名后 Authority 不是 Denpa Jack Dev（更新包与 TCC 身份都会出错）"; printf '%s\n' "$DV" | head -6; exit 1 ;;
          esac

      - name: Package artifacts
        run: |
          V="${RELEASE_TAG#v}"
          APP="src-tauri/target/release/bundle/macos/Denpa Jack.app"
          mkdir -p dist-release
          ditto -c -k --keepParent "$APP" "dist-release/Denpa.Jack_${V}_aarch64.app.zip"
          hdiutil create -volname "Denpa Jack" -srcfolder "$APP" -ov -format UDZO \
            "dist-release/Denpa.Jack_${V}_aarch64.dmg"
          # 应用内更新用的产物：必须在**代码签名之后**重新打包（tauri build 阶段产出的 tar.gz
          # 早于签名，里面是 ad-hoc 的 app → 更新后身份变化、权限授权全丢；实测踩过这个坑）。
          # 脚本内部有"必须是 Denpa Jack Dev 签名"的守卫。
          scripts/package-updater.sh "$V" dist-release
          # latest.json：应用内更新器轮询的清单（pubkey 校验签名 → 下载 → 替换）
          # 签名值必须是 .sig 文件全文（含 untrusted comment 行），交给 jq 转义换行
          # 注意：路径里的 ${V} 必须用双引号，单引号不会展开（曾因此产出 signature 为空的清单）
          jq -n \
            --arg v "$V" \
            --arg sig "$(cat "dist-release/Denpa.Jack_${V}_aarch64.app.tar.gz.sig")" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Denpa.Jack_${V}_aarch64.app.tar.gz" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(cat .github/release-notes.md)" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' \
            > dist-release/latest.json
          cat dist-release/latest.json | head -c 400; echo
          # 守卫：签名缺失/过短的清单会让所有客户端的更新校验失败，必须拦在发版前
          SIGLEN=$(jq -r '.platforms["darwin-aarch64"].signature | length' dist-release/latest.json)
          if [ "$SIGLEN" -lt 100 ]; then
            echo "::error::latest.json 的 signature 为空或过短（length=$SIGLEN），更新包无法通过校验"
            exit 1
          fi
          echo "latest.json 签名长度=$SIGLEN ✓"
          cd dist-release
          shasum -a 256 Denpa.Jack_*.zip Denpa.Jack_*.dmg Denpa.Jack_*.tar.gz > "SHA256SUMS_${V}.txt"
          cat "SHA256SUMS_${V}.txt"
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 gh CLI 建/更新 Release（runner 自带 gh；避免第三方 action 的 Node 运行时弃用问题）
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-release/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$(cat .github/release-notes.md)" \
              dist-release/*
          fi
