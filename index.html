<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice 输入</title>
  </head>
  <body class="settings-win" x-data="app()" x-init="init()">
    <div class="sidebar">
      <div class="search-box">
        <input type="text" placeholder="搜索…" x-model="search" />
      </div>
      <nav>
        <template x-for="s in filteredSections()" :key="s.id">
          <button class="nav-item" :class="{active: section === s.id}"
               x-text="s.title" @click="switchSection(s.id)"></button>
        </template>
      </nav>
      <div class="side-status" x-text="statusLine()"></div>
    </div>
<div class="content-in">
      <div data-page="asr"></div>
      <div data-page="history"></div>
      <div data-page="general"></div>
      <div data-page="dict"></div>
      <div data-page="llm"></div>
      <div data-page="about"></div>
    </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
